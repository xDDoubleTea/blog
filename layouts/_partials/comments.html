{{- /* giscus (GitHub Discussions) comments. Settings live in [params.giscus] in
hugo.toml; nothing renders until categoryId is set. */ -}}
{{- with site.Params.giscus }}
{{- if .categoryId }}
<div class="giscus-comments" style="margin-top: 2.5rem">
  <div class="giscus"></div>
</div>
<script>
(function () {
  // PaperMod marks dark mode with data-theme on <html> or a "dark" class on <body>
  function isDark() {
    return document.documentElement.dataset.theme === "dark" ||
      document.body.classList.contains("dark");
  }
  function giscusTheme() { return isDark() ? "dark" : "light"; }

  var s = document.createElement("script");
  s.src = "https://giscus.app/client.js";
  s.async = true;
  s.crossOrigin = "anonymous";
  var attrs = {
    "data-repo": {{ .repo }},
    "data-repo-id": {{ .repoId }},
    "data-category": {{ .category }},
    "data-category-id": {{ .categoryId }},
    "data-mapping": "pathname",
    "data-strict": "1",
    "data-reactions-enabled": "1",
    "data-emit-metadata": "0",
    "data-input-position": "top",
    "data-lang": {{ .lang | default "zh-TW" }},
    "data-loading": "lazy",
    "data-theme": giscusTheme()
  };
  for (var k in attrs) s.setAttribute(k, attrs[k]);
  document.querySelector(".giscus-comments").appendChild(s);

  // Follow the site's theme toggle after the widget has loaded
  function sync() {
    var frame = document.querySelector("iframe.giscus-frame");
    if (frame) frame.contentWindow.postMessage(
      { giscus: { setConfig: { theme: giscusTheme() } } }, "https://giscus.app");
  }
  var mo = new MutationObserver(sync);
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  mo.observe(document.body, { attributes: true, attributeFilter: ["class"] });
})();
</script>
{{- end }}
{{- end }}
