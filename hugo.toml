baseURL = 'https://blog.hoshiyomi-dev.work/'
locale = 'en-us'
title = 'Blog'
theme = 'PaperMod'

[markup.highlight]
# PaperMod ships its own chroma CSS, so highlight with classes
noClasses = false

[params]
env = 'production'
author = 'xDDoubleTea'
description = 'sleep'
defaultTheme = 'auto'
mainSections = ['post']
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowRssButtonInSectionTermList = true

[params.assets]
favicon = '/images/avatar.jpg'

[params.homeInfoParams]
Title = 'Hi, I am xDDoubleTea'
Content = 'Notes on systems, bugs and things I build.'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/xDDoubleTea'

[[params.socialIcons]]
name = 'rss'
url = '/index.xml'

[frontmatter]
lastmod = ['lastmod', ':fileModTime', ':default']

[outputs]
home = ['html', 'rss', 'json']

[[menus.main]]
name = 'Posts'
pageRef = '/post'
weight = 10

[[menus.main]]
name = 'Archive'
pageRef = '/archives'
weight = 20

[[menus.main]]
name = 'Search'
pageRef = '/search'
weight = 30
