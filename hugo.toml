baseURL = 'https://blog.hoshiyomi-dev.work/'
locale = 'en-us'
title = 'Blog'
theme = 'PaperMod'

[markup.highlight]
# PaperMod ships its own chroma CSS, so highlight with classes
noClasses = false

[params]
env = 'production'
author = 'xDDoubleTea'
description = 'sleep'
defaultTheme = 'auto'
mainSections = ['post']
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowRssButtonInSectionTermList = true

[params.assets]
favicon = '/favicon.svg'

[params.homeInfoParams]
Title = "xDDoubleTea's blog"
Content = '''
凡所有相，皆是虛妄。若見諸相非相，則見如來。——《金剛經》\
*All forms are illusory; see forms as no-forms, and you see the Tathāgata.*
'''

[params.footer]
text = '*Vanitas vanitatum, et omnia vanitas.*'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/xDDoubleTea'

[[params.socialIcons]]
name = 'leetcode'
url = 'https://leetcode.com/u/xddoubletea/'

[[params.socialIcons]]
name = 'discord'
url = 'https://discord.com/users/398444155132575756'

[[params.socialIcons]]
name = 'email'
url = 'mailto:a5457789889409@gmail.com'

[frontmatter]
lastmod = ['lastmod', ':fileModTime', ':default']

[outputs]
home = ['html', 'rss', 'json']

[[menus.main]]
name = 'Posts'
pageRef = '/post'
weight = 10

[[menus.main]]
name = 'Archive'
pageRef = '/archives'
weight = 20

[[menus.main]]
name = 'Search'
pageRef = '/search'
weight = 30
