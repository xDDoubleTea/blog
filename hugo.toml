baseURL = 'https://blog.hoshiyomi-dev.work/'
locale = 'en-us'
title = 'Blog'
theme = 'PaperMod'

[markup.highlight]
# PaperMod ships its own chroma CSS, so highlight with classes
noClasses = false

[params]
env = 'production'
author = 'xDDoubleTea'
description = 'sleep'
defaultTheme = 'auto'
mainSections = ['post']
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowRssButtonInSectionTermList = true

[params.assets]
favicon = '/favicon.svg'

[params.homeInfoParams]
Title = "xDDoubleTea's blog"
Content = '''
當我們還是小孩的時候，我們以為世界更為單純。\
沒有贏不了的比賽，努力就會得到回報，沒有什麼事是不可能的。\
一無所知，無知且愚蠢的孩子，用純真無垢的目光觀察世界後所產生的想法，那樣的想法——有錯嗎？\
真的有錯嗎……？\
—— 《遊戲人生 0》
'''

[params.footer]
text = '*Vanitas vanitatum, et omnia vanitas.*'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/xDDoubleTea'

[[params.socialIcons]]
name = 'leetcode'
url = 'https://leetcode.com/u/xddoubletea/'

[[params.socialIcons]]
name = 'discord'
url = 'https://discord.com/users/398444155132575756'

[[params.socialIcons]]
name = 'email'
url = 'mailto:a5457789889409@gmail.com'

[taxonomies]
category = 'categories'
tag = 'tags'
series = 'series'

[frontmatter]
lastmod = ['lastmod', ':fileModTime', ':default']

[outputs]
home = ['html', 'rss', 'json']

[[menus.main]]
name = 'Posts'
pageRef = '/post'
weight = 10

[[menus.main]]
name = 'Categories'
pageRef = '/categories'
weight = 13

[[menus.main]]
name = 'Tags'
pageRef = '/tags'
weight = 16

[[menus.main]]
name = 'Archive'
pageRef = '/archives'
weight = 20

[[menus.main]]
name = 'Search'
pageRef = '/search'
weight = 30
