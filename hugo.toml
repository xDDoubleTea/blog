baseURL = 'https://blog.hoshiyomi-dev.work/'
locale = 'en-us'
title = 'Blog'
theme = 'PaperMod'
# Count CJK characters as words, so word count and reading time work for Chinese posts
hasCJKLanguage = true

[markup.goldmark.renderer]
# Pass raw HTML in Markdown through instead of replacing it with <!-- raw HTML omitted -->
unsafe = true

[markup.goldmark.extensions.passthrough]
# Leave math untouched by Markdown; layouts/_markup/render-passthrough.html renders it
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
# Only dollar delimiters: \[ \] is used for literal brackets in link text
block = [['$$', '$$']]
inline = [['$', '$']]

[markup.tableOfContents]
# Posts use # for top-level sections, so include h1
startLevel = 1
endLevel = 3

[markup.highlight]
# PaperMod ships its own chroma CSS, so highlight with classes
noClasses = false

[params]
env = 'production'
author = 'xDDoubleTea'
description = 'sleep'
defaultTheme = 'auto'
mainSections = ['post']
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
# ShowShareButtons = true
ShowRssButtonInSectionTermList = true

[params.assets]
favicon = '/favicon.svg'

[params.homeInfoParams]
Title = "xDDoubleTea's blog"
Content = "1+1=?"
